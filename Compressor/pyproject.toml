[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vqlic"
version = "0.3.0"
description = "Multi-codebook VQ neural image codec with a context-coded rANS bitstream, for edge deployment"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

# Pinned loosely on purpose: the published checkpoints were written by torch 2.x
# and `torch.ao.quantization.quantize_fx` moved between minor versions, so the
# INT8 path is the part most sensitive to a torch upgrade. See requirements.txt
# for the versions the reported numbers were measured on.
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.23",
    "pillow>=9.0",
    "pytorch-msssim>=1.0",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
# Only needed to reproduce the comparison curves, not to run the codec.
baselines = [
    "compressai>=1.2",
    "lpips>=0.1.4",
    "brisque>=0.0.16",
]

[tool.setuptools]
packages = ["vqlic"]
